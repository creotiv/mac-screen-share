<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Mac Screen</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:#f5f5f7; font:16px/1.5 -apple-system, system-ui, sans-serif; text-align:center; padding:16px; }
  #overlay.hidden { display:none; }
  #msg { white-space: pre-line; max-width: 520px; }
  .spinner { width:28px; height:28px; border:3px solid #444; border-top-color:#f5f5f7; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); color:#aaa; font:13px -apple-system, system-ui, sans-serif;
    background:rgba(0,0,0,.6); padding:6px 12px; border-radius:20px; transition:opacity .5s; pointer-events:none; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="overlay"><div class="spinner"></div><div id="msg">Connecting…</div></div>
<div id="hint">Tap to toggle fullscreen</div>

<script>
const id = Math.random().toString(36).slice(2, 10);
const v = document.getElementById('v');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
let pc = null;
let pending = [];

function show(text) { msgEl.textContent = text; overlay.classList.remove('hidden'); }
function signal(msg) {
  return fetch('/signal', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...msg, to: 'host', from: id }) });
}

function reset() { pc?.close(); pc = null; pending = []; v.srcObject = null; }

async function onOffer(sdp) {
  reset();
  pc = new RTCPeerConnection({ iceServers: [] });
  pc.ontrack = e => { v.srcObject = e.streams[0]; v.play().catch(() => {}); };
  pc.onicecandidate = e => e.candidate && signal({ type: 'candidate', candidate: e.candidate });
  let localCands = 0, remoteCands = 0;
  pc.onicegatheringstatechange = () => console.log('[viewer] gathering', pc.iceGatheringState);
  pc.addEventListener('icecandidate', e => e.candidate && localCands++);
  pc.__countRemote = () => remoteCands++;
  const started = Date.now();
  const diag = setInterval(() => {
    if (!pc || pc.connectionState === 'connected' || pc.connectionState === 'closed') return clearInterval(diag);
    const secs = Math.round((Date.now() - started) / 1000);
    show(`Connecting… (${secs}s)\nvideo link: ${pc.connectionState}, ICE: ${pc.iceConnectionState}\n` +
         `candidates — this device: ${localCands}, Mac: ${remoteCands}` +
         (secs >= 10 ? '\n\nTaking too long: check the macOS firewall, VPN, and that both devices are on the same Wi-Fi.' : ''));
  }, 1000);
  pc.onconnectionstatechange = () => {
    console.log('[viewer] connection', pc.connectionState);
    if (pc.connectionState === 'connected') overlay.classList.add('hidden');
    if (pc.connectionState === 'failed') { show('Connection lost — retrying…'); setTimeout(() => signal({ type: 'join' }), 1500); }
  };
  await pc.setRemoteDescription(sdp);
  for (const c of pending) await pc.addIceCandidate(c).catch(() => {});
  pending = [];
  await pc.setLocalDescription(await pc.createAnswer());
  signal({ type: 'answer', sdp: pc.localDescription });
}

const es = new EventSource('/events?id=' + id);
es.onmessage = async ev => {
  const msg = JSON.parse(ev.data);
  if (msg.type === 'host-ready') { show('Connecting…'); signal({ type: 'join' }); }
  else if (msg.type === 'host-offline') { reset(); show('Waiting for the Mac to start sharing…'); }
  else if (msg.type === 'offer') onOffer(msg.sdp);
  else if (msg.type === 'candidate') {
    pc?.__countRemote?.();
    if (pc?.remoteDescription) pc.addIceCandidate(msg.candidate).catch(() => {});
    else pending.push(msg.candidate);
  }
};
es.onerror = () => show('Lost connection to the Mac — reconnecting…');

// Tap to toggle fullscreen (and lock landscape where supported)
document.body.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      await screen.orientation?.lock?.('landscape').catch(() => {});
    } else await document.exitFullscreen();
  } catch {}
});
setTimeout(() => document.getElementById('hint').style.opacity = 0, 4000);

// Keep the screen awake while watching (works when the browser allows it)
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
keepAwake();
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());
</script>
</body>
</html>
